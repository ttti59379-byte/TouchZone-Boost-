
name: Build TouchZone Boost APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "Project already extracted"
            exit 0
          fi

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "*TouchZoneBoost*.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir -p /tmp/touchzone
          unzip -q "$ZIP" -d /tmp/touchzone

          SETTINGS=$(find /tmp/touchzone -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")
          cp -a "$PROJECT"/. "$GITHUB_WORKSPACE"/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchZoneBoost-10x-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
