
name: Build Latest TouchZone Boost APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest version and unpack
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "TouchZoneBoost-*.zip" \
            | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "Selected archive: $ZIP"

          mkdir -p /tmp/touchzone
          unzip -q "$ZIP" -d /tmp/touchzone

          SETTINGS=$(find /tmp/touchzone \
            -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project not found"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")
          cp -a "$PROJECT"/. "$GITHUB_WORKSPACE"/

          echo "Android project extracted"
          grep 'versionName' app/build.gradle || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchZoneBoost-Latest-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
